<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Kolekcje</title>


<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#13141a; --panel:#1a1c24; --panel-2:#20222c; --line:#2c2f3a;
    --gold:#B8934A; --gold-soft:#D4AE6A; --gold-dim:#5f4f30; --parchment:#E7E1D3; --muted:#7c8195;
    --classified:#c23bd1; --restricted:#7a54d6; --milspec:#3f5fc7; --industrial:#4c85b8; --consumer:#9aabbd;
    --covert:#d64545; --goldrare:#E5B84B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:'IBM Plex Mono',monospace;color:var(--parchment);
    background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;
    min-height:100vh;padding:26px 12px;
  }

  .app{
    background:var(--bg);border:1px solid var(--line);border-radius:3px;
    padding:32px clamp(14px,4vw,40px) 46px;max-width:1040px;margin:0 auto;
  }

  /* ── Header ───────────────────────────────────────────── */
  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;
    border-bottom:2px solid var(--line);padding-bottom:18px;margin-bottom:26px;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;}
  .title-row{display:flex;align-items:center;gap:11px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(27px,5vw,38px);margin:0;letter-spacing:.01em;color:var(--parchment);}
  .avatar-img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);flex-shrink:0;}

  .stats{display:flex;flex-wrap:wrap;}
  .stat{padding:0 18px;border-left:1px solid var(--line);text-align:right;}
  .stat:first-child{border-left:none;padding-left:0;}
  .stat b{color:var(--gold-soft);font-size:19px;font-weight:500;display:block;line-height:1.3;}
  .stat span{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;}
  .stat.stat-grade{border-left-width:3px;padding-left:15px;}

  .empty-link{
    display:inline-block;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.04em;color:var(--gold-soft);text-decoration:none;border:1px solid var(--gold-dim);
    padding:8px 16px;background:none;cursor:pointer;
  }
  .empty-link:hover{border-color:var(--gold);color:var(--gold);}

  /* wygląda jakby był ukryty/zlewał się z tłem strony, dopóki go nie znajdziesz */
  .easter-link{
    display:inline-block;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.04em;color:var(--bg);text-decoration:none;border:1px solid var(--bg);
    padding:8px 16px;background:var(--bg);cursor:pointer;transition:color .35s ease,border-color .35s ease;
  }
  .easter-link:hover{color:var(--gold-soft);border-color:var(--gold-dim);}

  /* ── Tabs ─────────────────────────────────────────────── */
  .tabs{display:flex;gap:22px;margin-bottom:24px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tab-btn{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;
    padding:0 0 11px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;}
  .tab-btn:hover{color:var(--parchment);}
  .tab-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);}

  /* ── Filters & search ─────────────────────────────────── */
  .filter-bar{display:flex;gap:0;margin-bottom:18px;flex-wrap:wrap;border:1px solid var(--line);width:fit-content;}
  .filter-btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.03em;padding:8px 14px;
    border:none;border-right:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;}
  .filter-btn:last-child{border-right:none;}
  .filter-btn:hover{color:var(--parchment);}
  .filter-btn.active{color:var(--gold-soft);background:var(--panel-2);}
  .bar-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .bar-row .filter-bar{margin-bottom:0;}
  .bar-row .sort-group{margin-left:auto;}
  .filter-btn.sort-btn{color:var(--muted);}
  .filter-btn.sort-btn:last-child{min-width:58px;text-align:center;}
  .filter-btn.sort-btn.active{color:var(--gold);}

  /* proporcjonalne, równej wysokości cyfry (Cormorant domyślnie ma cyfry nautoregularne) */
  body{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;}
  h1,.group-label,.collection-title,.skin-name,.cd-title,.cd-section-label,.cd-skin-name,.cd-shared h4,.profile-name{
    font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;}
  .cd-facts b,.cd-fact b,.qty-val,.stat b,.completion-tag{font-variant-numeric:lining-nums tabular-nums;}

  .search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:0;
    padding:10px 12px;color:var(--parchment);font-size:13px;font-family:'IBM Plex Mono',monospace;margin-bottom:22px;}
  .search::placeholder{color:var(--muted);}
  .search:focus{outline:none;border-color:var(--gold);}

  .view{display:none;} .view.active{display:block;}

  .group-label{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;margin:28px 0 13px;
    color:var(--gold-soft);border-bottom:1px solid var(--line);padding-bottom:7px;}
  .group-label:first-child{margin-top:0;}

  /* ── Cases grid ───────────────────────────────────────── */
  .case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:1px;background:var(--line);}
  .case-card{background:var(--panel);padding:14px 15px;}
  .case-card:not(.owned){opacity:.42;}
  .case-card:hover{background:var(--panel-2);}
  .case-meta-acq{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}
  .case-meta-acq .status-tag{font-size:9px;}

  .case-img{width:100%;height:80px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;}
  .case-img img{width:100%;height:100%;object-fit:contain;}
  .case-img .ph{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}

  .case-name{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:10px;display:block;font-family:'IBM Plex Mono',monospace;}

  .case-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .qty-row{display:flex;align-items:baseline;gap:6px;}
  .qty-val{font-size:19px;color:var(--gold-soft);font-weight:600;}
  .qty-label{font-size:10px;color:var(--muted);}
  .status-tag{font-size:9.5px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;}
  .status-tag.on{color:var(--gold-soft);}

  .case-detail-btn{
    margin-top:10px;width:100%;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.03em;
    padding:7px 8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;
  }
  .case-detail-btn:hover{color:var(--gold-soft);border-color:var(--gold-dim);}

  /* ── Collections ──────────────────────────────────────── */
  .collection-block{margin-bottom:32px;}
  .collection-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
    border-bottom:2px solid var(--line);padding-bottom:9px;margin-bottom:15px;}
  .collection-title{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:700;margin:0;color:var(--parchment);}
  .completion-tag{font-size:11px;color:var(--muted);white-space:nowrap;}
  .completion-tag b{color:var(--gold-soft);font-weight:600;}

  .rarity-group{margin-bottom:18px;}
  .rarity-group-label{display:flex;align-items:center;gap:8px;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.07em;margin:0 0 9px;color:var(--muted);}
  .rarity-group-label .rdot{width:6px;height:6px;border-radius:50%;}
  .rarity-group-label .rcount{color:var(--muted);font-weight:400;}

  .skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:1px;background:var(--line);}
  .skin-card{background:var(--panel);padding:8px 10px;border-left:3px solid var(--consumer);}
  .skin-card:hover{background:var(--panel-2);}

  .skin-img{width:100%;height:68px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;}
  .skin-img img{width:100%;height:100%;object-fit:contain;}
  .skin-img .ph{font-size:8px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .skin-grade{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;display:block;}
  .skin-weapon{font-size:10.5px;color:var(--muted);}
  .skin-name{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;color:var(--parchment);}

  .g-classified{border-left-color:var(--classified);} .g-classified .skin-grade{color:var(--classified);}
  .g-restricted{border-left-color:var(--restricted);} .g-restricted .skin-grade{color:var(--restricted);}
  .g-milspec{border-left-color:var(--milspec);} .g-milspec .skin-grade{color:var(--milspec);}
  .g-industrial{border-left-color:var(--industrial);} .g-industrial .skin-grade{color:var(--industrial);}
  .g-consumer{border-left-color:var(--consumer);} .g-consumer .skin-grade{color:var(--consumer);}
  .g-covert{border-left-color:var(--covert);} .g-covert .skin-grade{color:var(--covert);}
  .g-gold{border-left-color:var(--goldrare);} .g-gold .skin-grade{color:var(--goldrare);}
  .g-gold{background:linear-gradient(180deg, rgba(229,184,75,.07), transparent);}

  /* ── Szczegóły skrzynki ───────────────────────────────── */
  .cd-head{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin:20px 0 18px;}
  .cd-img{width:132px;height:100px;background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .cd-img img{width:100%;height:100%;object-fit:contain;}
  .cd-img .ph{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .cd-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin:0 0 4px;color:var(--parchment);}
  .cd-sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 12px;}
  .cd-facts{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);background:var(--panel);width:fit-content;}
  .cd-fact{padding:9px 16px;border-right:1px solid var(--line);}
  .cd-fact:last-child{border-right:none;}
  .cd-fact span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px;}
  .cd-fact b{font-size:13px;font-weight:500;color:var(--parchment);}
  .cd-fact b.on{color:var(--gold-soft);}
  .cd-note{font-size:12px;color:var(--muted);line-height:1.7;white-space:pre-line;margin:14px 0 0;max-width:620px;}
  .cd-section-label{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;margin:26px 0 12px;
    color:var(--gold-soft);border-bottom:1px solid var(--line);padding-bottom:7px;}

  .cd-rarity-group{margin-bottom:10px;}
  .cd-rarity-group .rarity-group-label{margin-bottom:6px;}
  .cd-skin-grid{display:inline-flex;flex-wrap:wrap;gap:1px;background:var(--line);}
  .cd-skin-card{width:126px;flex:0 0 126px;background:var(--panel);padding:7px 8px;border-left:3px solid var(--consumer);}
  .cd-skin-card:hover{background:var(--panel-2);}
  .cd-skin-img{width:100%;height:46px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:5px;}
  .cd-skin-img img{width:100%;height:100%;object-fit:contain;}
  .cd-skin-img .ph{font-size:7.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .cd-skin-grade{font-size:8px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;display:block;}
  .cd-skin-weapon{font-size:9.5px;color:var(--muted);}
  .cd-skin-name{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:600;color:var(--parchment);line-height:1.15;}
  .cd-skin-card.clickable{cursor:pointer;}
  .cd-skin-card.clickable.open{outline:1px solid var(--gold);}
  .cd-skin-more{font-size:7.5px;color:var(--gold-soft);letter-spacing:.05em;text-transform:uppercase;margin-top:4px;display:block;}
  .cd-shared{border:1px solid var(--gold);background:var(--panel);padding:10px 12px;margin:0 0 12px;}
  .cd-shared h4{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--gold);margin:0 0 8px;font-weight:600;}
  .cd-shared-list{display:flex;flex-wrap:wrap;gap:6px;}
  .cd-shared-item{font-size:10px;letter-spacing:.03em;padding:4px 8px;border:1px solid var(--line);
    background:var(--bg);color:var(--parchment);cursor:pointer;}
  .cd-shared-item:hover{border-color:var(--gold);color:var(--gold);}
  .cd-shared-item.self{opacity:.5;cursor:default;}
  .cd-wear-row{display:flex;gap:2px;margin-top:5px;flex-wrap:wrap;}
  .cd-wear-chip{font-size:7.5px;letter-spacing:.02em;padding:1px 3px;border:1px solid var(--line);
    background:var(--bg);color:var(--muted);}
  .cd-wear-chip.active{background:var(--gold);border-color:var(--gold);color:#13141a;font-weight:600;}

  .wear-row{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;}
  .wear-chip{font-size:9.5px;letter-spacing:.03em;padding:3px 6px;border:1px solid var(--line);
    background:var(--bg);color:var(--muted);}
  .wear-chip.active{background:var(--gold);border-color:var(--gold);color:#13141a;font-weight:600;}

  .empty{text-align:center;padding:44px;color:var(--muted);border:1px dashed var(--line);font-size:12.5px;}
  .hidden{display:none !important;}

  /* ── Profil (easter egg) ──────────────────────────────── */
  .profile-top-row{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;margin-bottom:28px;}
  .profile-head{display:flex;gap:22px;align-items:flex-start;flex:1 1 320px;margin-bottom:0;}
  .profile-side{flex:0 1 220px;min-width:180px;padding-top:2px;}
  .profile-side-text{font-size:12px;color:var(--muted);line-height:1.7;white-space:pre-line;}
  @media (max-width:700px){ .profile-top-row{flex-direction:column;} }
  .profile-avatar-box{width:96px;height:96px;background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .profile-avatar-box img{width:100%;height:100%;object-fit:cover;}
  .profile-avatar-box .ph{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .profile-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:2px 0 6px;}
  .profile-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin:0 0 8px;color:var(--parchment);}
  .profile-status{font-size:12px;color:var(--muted);max-width:540px;line-height:1.7;white-space:pre-line;}

  .profile-contact{border:1px solid var(--line);background:var(--panel);margin-bottom:6px;}
  .profile-contact-row{font-size:12.5px;color:var(--parchment);margin:0;padding:11px 18px;
    display:flex;align-items:baseline;gap:16px;}
  .profile-contact-row + .profile-contact-row{border-top:1px solid var(--line);}
  .profile-contact-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--gold-soft);width:64px;flex-shrink:0;}

  .profile-photo-row{display:flex;gap:12px;flex-wrap:wrap;}
  .profile-photo-box{flex:1;min-width:180px;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--line);
    overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .profile-photo-box img{width:100%;height:100%;display:block;object-fit:cover;}
  .profile-photo-box.ph-only{padding:20px;text-align:center;}
  .profile-photo-box .ph{font-size:10.5px;color:var(--muted);letter-spacing:.03em;line-height:1.6;}

  .secret2-layout{display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
  .secret2-text{flex:1 1 260px;min-width:220px;}
  .secret2-photo{flex:0 0 auto;width:180px;max-width:100%;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--line);
    overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .secret2-photo img{width:100%;height:100%;display:block;object-fit:cover;}
  .secret2-photo.ph-only{padding:20px;text-align:center;}
  @media (max-width:700px){ .secret2-layout{flex-direction:column;} }

  /* ── Poprawki UI (v10) ────────────────────────────────── */
  html{scroll-behavior:smooth;}
  ::selection{background:var(--gold-dim);color:var(--parchment);}
  *:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .case-card,.skin-card,.cd-skin-card{transition:background .18s ease,transform .18s ease,box-shadow .18s ease,opacity .18s ease;}
  .case-card:hover,.skin-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .case-card:not(.owned):hover{opacity:.75;}
  .tab-btn,.filter-btn,.case-detail-btn{transition:color .18s ease,background .18s ease,border-color .18s ease;}
  .case-img img,.skin-img img{transition:transform .25s ease;}
  .case-card:hover .case-img img,.skin-card:hover .skin-img img{transform:scale(1.04);}

  .search-wrap{position:relative;margin-bottom:8px;}
  .search-wrap .search{margin-bottom:0;padding-right:82px;}
  .search-clear{position:absolute;top:50%;right:8px;transform:translateY(-50%);
    background:transparent;border:1px solid var(--line);color:var(--muted);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 9px;}
  .search-clear:hover{color:var(--gold-soft);border-color:var(--gold-dim);}
  .search-hint{position:absolute;top:50%;right:8px;transform:translateY(-50%);
    font-size:10px;color:var(--muted);letter-spacing:.06em;pointer-events:none;opacity:.75;}
  .result-count{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    min-height:15px;margin:0 0 16px;}
  .result-count b{color:var(--gold-soft);font-weight:600;}
  .empty .empty-actions{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  @media (max-width:600px){
    body{padding:14px 8px;}
    .app{padding:20px 12px 32px;}
    .header{align-items:flex-start;gap:12px;}
    .stats{width:100%;}
    .stat{padding:0 12px;}
    .tabs{gap:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tab-btn{white-space:nowrap;}
    .filter-bar{width:100%;}
    .filter-btn{flex:1 1 auto;}
    .search-hint{display:none;}
    .case-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
    .skin-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
    .case-card:hover,.skin-card:hover{transform:none;}
  }

  /* ── Skiny na serwerze ────────────────────────────────── */
  .srv-intro{border:1px solid var(--line);background:var(--panel);padding:16px 18px;margin:0 0 18px;}
  .srv-intro h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin:0 0 8px;color:var(--parchment);}
  .srv-intro p{margin:0 0 6px;font-size:12px;line-height:1.65;color:var(--muted);}
  .srv-intro p b{color:var(--gold-soft);font-weight:500;}
  .srv-intro code{color:var(--gold);font-size:11.5px;}
  .srv-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px;}
  .srv-search{flex:1 1 240px;background:var(--panel-2);border:1px solid var(--line);color:var(--parchment);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:10px 12px;border-radius:2px;outline:none;}
  .srv-search:focus{border-color:var(--gold-dim);}
  .srv-count{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .srv-count b{color:var(--gold-soft);}
  .srv-chosen{border:1px solid var(--gold-dim);background:var(--panel);padding:14px 16px;margin:0 0 22px;}
  .srv-chosen-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .srv-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);
    padding:6px 9px;font-size:11px;color:var(--parchment);}
  .srv-chip img{width:44px;height:26px;object-fit:contain;}
  .srv-chip .srv-chip-w{color:var(--gold-soft);}
  .srv-chip button{background:none;border:none;color:var(--covert);cursor:pointer;font-size:13px;line-height:1;padding:0 2px;}
  .srv-skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .srv-card{border:1px solid var(--line);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:6px;
    cursor:pointer;transition:border-color .15s,transform .15s;}
  .srv-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);}
  .srv-card.selected{border-color:var(--gold);background:var(--panel-2);}
  .srv-card .srv-img{background:var(--panel-2);border:1px solid var(--line);height:92px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .srv-card .srv-img img{max-width:100%;max-height:100%;object-fit:contain;}
  .srv-card .srv-img .ph{font-size:10px;color:var(--muted);}
  .srv-grade{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .srv-weapon{font-size:11.5px;color:var(--gold-soft);}
  .srv-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:var(--parchment);line-height:1.2;}
  .srv-col{font-size:10px;color:var(--muted);}
  .srv-pick{margin-top:auto;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dim);}
  .srv-card.selected .srv-pick{color:var(--gold);}

  /* ── Float + Pattern (seed) ───────────────────────────── */
  .srv-fp{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px;}
  .srv-fp-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .srv-fp-lab{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:52px;}
  .srv-fp-input{width:74px;background:var(--panel-2);border:1px solid var(--line);color:var(--parchment);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 5px;outline:none;}
  .srv-fp-input:focus{border-color:var(--gold-dim);}
  .srv-fp-range{flex:1 1 80px;accent-color:var(--gold);height:14px;}
  .srv-fp-chip{font-size:8.5px;letter-spacing:.03em;padding:2px 5px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--muted);cursor:pointer;font-family:'IBM Plex Mono',monospace;}
  .srv-fp-chip:hover{border-color:var(--gold-dim);color:var(--parchment);}
  .srv-fp-chip.active{background:var(--gold);border-color:var(--gold);color:#13141a;font-weight:600;}
  .srv-fp-note{font-size:9px;color:var(--muted);}

  /* ── Skiny na serwerze: strony, StatTrak, zapis ───────── */
  .srv-side-bar{display:flex;gap:8px;margin:0 0 14px;}
  .srv-side-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;}
  .srv-side-btn:hover{border-color:var(--gold-dim);color:var(--parchment);}
  .srv-side-btn.active{border-color:var(--gold);color:var(--gold);background:var(--panel-2);}
  .srv-side-btn small{display:block;font-size:9.5px;letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:2px;}
  .srv-savebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:1px solid var(--line);
    background:var(--panel-2);padding:12px 14px;margin:0 0 18px;}
  .srv-save-btn{border:1px solid var(--gold);background:var(--gold-dim);color:#12100c;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px;}
  .srv-save-btn:hover{background:var(--gold);}
  .srv-save-btn[disabled]{opacity:.4;cursor:not-allowed;background:var(--panel);color:var(--muted);border-color:var(--line);}
  .srv-save-note{font-size:11px;color:var(--muted);}
  .srv-save-note.dirty{color:var(--gold-soft);}
  .srv-save-note.err{color:var(--covert);}
  .srv-save-note.ok{color:var(--milspec, #7fb069);}
  .srv-limits{font-size:10.5px;color:var(--muted);letter-spacing:.04em;}
  .srv-st{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:2px;}
  .srv-st input{accent-color:var(--gold);cursor:pointer;}
  .srv-st.on{color:#e08b3a;}
  .srv-chip .srv-st-tag{color:#e08b3a;font-size:9.5px;letter-spacing:.06em;}
  .srv-kindtag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dim);}
  #srvStatus{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:var(--panel);padding:8px 12px;font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  #srvStatus .dot{width:8px;height:8px;border-radius:50%;background:var(--covert);box-shadow:0 0 8px currentColor;}
  #srvStatus.online{border-color:var(--gold-dim);color:var(--gold-soft);}
  #srvStatus.online .dot{background:#7fb069;}
  #srvStatus.checking .dot{background:var(--gold-dim);}

  /* ── Ulepszony interfejs itemów (skiny w skrzynkach, kolekcjach, quizach) ── */
  .g-covert{--gcol:var(--covert);} .g-classified{--gcol:var(--classified);}
  .g-restricted{--gcol:var(--restricted);} .g-milspec{--gcol:var(--milspec);}
  .g-industrial{--gcol:var(--industrial);} .g-consumer{--gcol:var(--consumer);}
  .g-gold{--gcol:var(--goldrare);}

  .skin-card,.cd-skin-card{
    position:relative;overflow:hidden;
    border-left:3px solid var(--gcol,var(--consumer));
    background:
      radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--gcol,var(--consumer)) 16%, transparent) 0%, transparent 62%),
      linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
  }
  .skin-card::after,.cd-skin-card::after{
    content:'';position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg, var(--gcol,var(--consumer)), transparent 78%);opacity:.6;
  }
  .skin-card:hover,.cd-skin-card:hover{
    background:
      radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--gcol,var(--consumer)) 30%, transparent) 0%, transparent 66%),
      linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    box-shadow:0 8px 22px rgba(0,0,0,.45),
               inset 0 0 0 1px color-mix(in srgb, var(--gcol,var(--consumer)) 42%, transparent);
  }
  .skin-card:hover::after,.cd-skin-card:hover::after{opacity:1;}

  .skin-img,.cd-skin-img{
    position:relative;
    border:1px solid color-mix(in srgb, var(--gcol,var(--consumer)) 28%, var(--line));
    background:
      radial-gradient(80% 100% at 50% 100%, color-mix(in srgb, var(--gcol,var(--consumer)) 22%, transparent) 0%, transparent 70%),
      var(--bg);
  }
  .skin-img img,.cd-skin-img img{
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));
    transition:transform .25s ease, filter .25s ease;
  }
  .skin-card:hover .skin-img img,.cd-skin-card:hover .cd-skin-img img{
    transform:scale(1.07);filter:drop-shadow(0 5px 12px rgba(0,0,0,.6)) brightness(1.08);
  }

  .skin-grade,.cd-skin-grade{
    display:inline-flex;align-items:center;gap:5px;font-weight:500;
    color:color-mix(in srgb, var(--gcol,var(--consumer)) 80%, var(--parchment));
  }
  .skin-grade::before,.cd-skin-grade::before{
    content:'';width:5px;height:5px;border-radius:50%;
    background:var(--gcol,var(--consumer));
    box-shadow:0 0 7px color-mix(in srgb, var(--gcol,var(--consumer)) 75%, transparent);
  }
  .skin-weapon,.cd-skin-weapon{letter-spacing:.03em;}
  .skin-name,.cd-skin-name{letter-spacing:.01em;}

  .g-gold.skin-card,.g-gold.cd-skin-card{
    background:
      radial-gradient(120% 95% at 50% 0%, rgba(229,184,75,.24) 0%, transparent 64%),
      linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
  }
</style>

<style>
  /* ── UI refresh ─────────────────────────────────────────── */
  :root{
    --shadow-soft: 0 1px 0 rgba(255,255,255,.02), 0 12px 34px rgba(0,0,0,.45);
    --grad-gold: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  html{scrollbar-color: var(--gold-dim) var(--bg); scrollbar-width: thin;}
  ::selection{background:rgba(184,147,74,.35);}
  body{padding:30px 14px;}
  .app{
    border-radius:10px;
    background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 45%, var(--bg)) 0%, var(--bg) 260px);
    box-shadow:var(--shadow-soft);
    position:relative;overflow:hidden;
  }
  .app::before{
    content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--grad-gold);opacity:.7;
  }
  .header{border-bottom:1px solid var(--line);position:relative;}
  .header::after{content:'';position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:var(--gold);opacity:.85;}
  h1{letter-spacing:.005em;text-shadow:0 2px 18px rgba(0,0,0,.5);}
  .eyebrow{opacity:.9;}
  .stat b{font-variant-numeric:tabular-nums;}

  /* Tabs */
  .tabs{position:sticky;top:0;z-index:40;
    backdrop-filter:blur(8px);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    padding:8px 0;margin-bottom:4px;}

  /* Search */
  .search-wrap{position:relative;margin-top:14px;}
  .search{
    border-radius:8px;
    background:color-mix(in srgb, var(--panel-2) 92%, transparent)!important;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .search:focus{
    outline:none;border-color:var(--gold)!important;
    box-shadow:0 0 0 3px rgba(184,147,74,.16);
  }
  .search::placeholder{color:var(--muted);opacity:.85;}

  /* Buttons */
  .filter-btn,.quiz-btn,.empty-link,.easter-link{
    border-radius:6px;
    transition:border-color .15s ease, color .15s ease, background .15s ease, transform .08s ease;
  }
  .filter-btn:hover,.quiz-btn:hover{transform:translateY(-1px);}
  .filter-btn:active,.quiz-btn:active{transform:translateY(0) scale(.985);}
  .filter-btn.active{box-shadow:inset 0 0 0 1px rgba(184,147,74,.35);}

  /* Cards */
  .case-card,.cd-skin-card,.col-card,.srv-chip{
    border-radius:8px;
    transition:transform .12s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .case-card:hover,.col-card:hover{
    transform:translateY(-3px);
    border-color:var(--gold-dim);
    box-shadow:0 14px 30px rgba(0,0,0,.5);
  }
  .cd-skin-card:hover{border-color:var(--gold-dim);}

  /* HUD / panels */
  .quiz-hud,.quiz-target{border-radius:8px;background:color-mix(in srgb, var(--panel) 70%, transparent);}
  #srvStatus{border-radius:999px;box-shadow:var(--shadow-soft);}

  /* Focus visibility for keyboard users */
  a:focus-visible,button:focus-visible,input:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;
  }

  @media (max-width:640px){
    body{padding:16px 8px;}
    .app{padding-left:12px;padding-right:12px;border-radius:8px;}
    .stat{padding:0 12px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
  }
</style>

<style>
  /* ── Karty itemów v2: szersze, panoramiczne, ścięte rogi zamiast zaokrągleń ── */
  .cd-skin-grid{gap:8px;background:transparent;}
  .skin-grid{gap:8px;background:transparent;}

  .skin-card,.cd-skin-card{
    border-radius:0;
    border-left:none;
    clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gcol,var(--consumer)) 22%, var(--line));
  }
  .cd-skin-card{width:168px;flex:0 0 168px;padding:9px 10px 10px;}

  /* dolny pasek rzadkości zamiast grubej lewej krechy */
  .skin-card::before,.cd-skin-card::before{
    content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
    background:linear-gradient(90deg, var(--gcol,var(--consumer)), color-mix(in srgb, var(--gcol,var(--consumer)) 12%, transparent));
  }
  .skin-card,.cd-skin-card{position:relative;}
  .cd-skin-card:hover,.skin-card:hover{
    box-shadow:0 10px 26px rgba(0,0,0,.5),
               inset 0 0 0 1px color-mix(in srgb, var(--gcol,var(--consumer)) 55%, transparent);
  }

  /* panoramiczny kadr obrazka (16:9), bez zaokrągleń */
  .cd-skin-img{height:auto;aspect-ratio:16/9;border-radius:0;}
  .skin-img{height:auto;aspect-ratio:16/9;border-radius:0;}
  .cd-skin-img,.skin-img{
    clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));

    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gcol,var(--consumer)) 26%, var(--line));

  .cd-skin-img img,.skin-img img{width:100%;height:100%;object-fit:contain;padding:4px;}

  .cd-skin-weapon,.skin-weapon{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-skin-name,.skin-name{line-height:1.15;}
  .cd-skin-card .cd-skin-grade{font-size:8.5px;}

  /* quiz i inne warianty trzymają ten sam kadr */

  #view-quizy .cd-skin-card.clickable:hover{transform:translateY(-3px) scale(1.03);}

  @media (max-width:640px){
    .cd-skin-card{width:140px;flex:0 0 140px;}
  }
</style>
<style>
  /* ── Siatka itemów w skrzynce: 7 w rzędzie ── */

  .case-card:hover{

</style>
<style>
  /* ── Kompaktowa siatka skrzynek / terminali (mniej miejsca, więcej w rzędzie) ── */

<body>
<div class="app">
  <div class="header">
    <div class="title-group">
      <p class="eyebrow">Steam · Rejestr Przedmiotów</p>
      <div class="title-row">
        <img class="avatar-img hidden" id="avatarImg" alt="Avatar">
        <h1>Kolekcja Itemów</h1>
      </div>
    </div>
    <div class="stats" id="statsBar"></div>
  </div>

  <div class="tabs" id="tabsBar"></div>

  <div class="search-wrap">
    <input class="search" id="searchInput" type="search" autocomplete="off" spellcheck="false"
           placeholder="Wyszukaj skrzynię, skina, easter egga albo Quizy…" aria-label="Szukaj" />
    <span class="search-hint" id="searchHint">/ szukaj</span>
    <button class="search-clear hidden" id="searchClear" type="button" title="Wyczyść (Esc)">Wyczyść</button>
  </div>
  <p class="result-count" id="resultCount"></p>

  <div class="view active" id="view-cases">
    <div class="bar-row">
      <div class="filter-bar">
        <button class="filter-btn active" data-cat="skrzynia">Skrzynie</button>
        <button class="filter-btn active" data-cat="waliza">Walizy (eSports)</button>
        <button class="filter-btn active" data-cat="terminal">Terminale</button>
        <button class="filter-btn" id="noSplitBtn" title="Pokaż wszystko w jednej sekcji">Bez dzielenia</button>
      </div>
      <div class="filter-bar sort-group">
        <button class="filter-btn sort-btn" id="sortAlphaBtn" title="Sortuj alfabetycznie">Alfabetycznie</button>
        <button class="filter-btn sort-btn" id="sortDirBtn" title="Odwróć kolejność">A→Z</button>
      </div>
    </div>
    <div id="casesGrid"></div>
  </div>

  <div class="view" id="view-collections">
    <div class="bar-row">
      <div class="filter-bar" id="collectionFilterBar"></div>
      <div class="filter-bar sort-group">
        <button class="filter-btn sort-btn" id="colSortAlphaBtn" title="Sortuj alfabetycznie">Alfabetycznie</button>
        <button class="filter-btn sort-btn" id="colSortDirBtn" title="Odwróć kolejność">A→Z</button>
      </div>
    </div>
    <div id="collectionsContainer"></div>
