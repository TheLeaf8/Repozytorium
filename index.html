<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Kolekcje</title>


<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#13141a; --panel:#1a1c24; --panel-2:#20222c; --line:#2c2f3a;
    --gold:#B8934A; --gold-soft:#D4AE6A; --gold-dim:#5f4f30; --parchment:#E7E1D3; --muted:#7c8195;
    --classified:#c23bd1; --restricted:#7a54d6; --milspec:#3f5fc7; --industrial:#4c85b8; --consumer:#9aabbd;
    --covert:#d64545; --goldrare:#E5B84B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:'IBM Plex Mono',monospace;color:var(--parchment);
    background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;
    min-height:100vh;padding:26px 12px;
  }

  .app{
    background:var(--bg);border:1px solid var(--line);border-radius:3px;
    padding:32px clamp(14px,4vw,40px) 46px;max-width:1040px;margin:0 auto;
  }

  /* ── Header ───────────────────────────────────────────── */
  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;
    border-bottom:2px solid var(--line);padding-bottom:18px;margin-bottom:26px;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;}
  .title-row{display:flex;align-items:center;gap:11px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(27px,5vw,38px);margin:0;letter-spacing:.01em;color:var(--parchment);}
  .avatar-img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);flex-shrink:0;}

  .stats{display:flex;flex-wrap:wrap;}
  .stat{padding:0 18px;border-left:1px solid var(--line);text-align:right;}
  .stat:first-child{border-left:none;padding-left:0;}
  .stat b{color:var(--gold-soft);font-size:19px;font-weight:500;display:block;line-height:1.3;}
  .stat span{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;}
  .stat.stat-grade{border-left-width:3px;padding-left:15px;}

  .empty-link{
    display:inline-block;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.04em;color:var(--gold-soft);text-decoration:none;border:1px solid var(--gold-dim);
    padding:8px 16px;background:none;cursor:pointer;
  }
  .empty-link:hover{border-color:var(--gold);color:var(--gold);}

  /* wygląda jakby był ukryty/zlewał się z tłem strony, dopóki go nie znajdziesz */
  .easter-link{
    display:inline-block;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.04em;color:var(--bg);text-decoration:none;border:1px solid var(--bg);
    padding:8px 16px;background:var(--bg);cursor:pointer;transition:color .35s ease,border-color .35s ease;
  }
  .easter-link:hover{color:var(--gold-soft);border-color:var(--gold-dim);}

  /* ── Tabs ─────────────────────────────────────────────── */
  .tabs{display:flex;gap:22px;margin-bottom:24px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tab-btn{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;
    padding:0 0 11px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;}
  .tab-btn:hover{color:var(--parchment);}
  .tab-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);}

  /* ── Filters & search ─────────────────────────────────── */
  .filter-bar{display:flex;gap:0;margin-bottom:18px;flex-wrap:wrap;border:1px solid var(--line);width:fit-content;}
  .filter-btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.03em;padding:8px 14px;
    border:none;border-right:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;}
  .filter-btn:last-child{border-right:none;}
  .filter-btn:hover{color:var(--parchment);}
  .filter-btn.active{color:var(--gold-soft);background:var(--panel-2);}
  .bar-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .bar-row .filter-bar{margin-bottom:0;}
  .bar-row .sort-group{margin-left:auto;}
  .filter-btn.sort-btn{color:var(--muted);}
  .filter-btn.sort-btn:last-child{min-width:58px;text-align:center;}
  .filter-btn.sort-btn.active{color:var(--gold);}

  /* proporcjonalne, równej wysokości cyfry (Cormorant domyślnie ma cyfry nautoregularne) */
  body{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;}
  h1,.group-label,.collection-title,.skin-name,.cd-title,.cd-section-label,.cd-skin-name,.cd-shared h4,.profile-name{
    font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;}
  .cd-facts b,.cd-fact b,.qty-val,.stat b,.completion-tag{font-variant-numeric:lining-nums tabular-nums;}

  .search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:0;
    padding:10px 12px;color:var(--parchment);font-size:13px;font-family:'IBM Plex Mono',monospace;margin-bottom:22px;}
  .search::placeholder{color:var(--muted);}
  .search:focus{outline:none;border-color:var(--gold);}

  .view{display:none;} .view.active{display:block;}

  .group-label{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;margin:28px 0 13px;
    color:var(--gold-soft);border-bottom:1px solid var(--line);padding-bottom:7px;}
  .group-label:first-child{margin-top:0;}

  /* ── Cases grid ───────────────────────────────────────── */
  .case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:1px;background:var(--line);}
  .case-card{background:var(--panel);padding:14px 15px;}
  .case-card:not(.owned){opacity:.42;}
  .case-card:hover{background:var(--panel-2);}
  .case-meta-acq{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}
  .case-meta-acq .status-tag{font-size:9px;}

  .case-img{width:100%;height:80px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;}
  .case-img img{width:100%;height:100%;object-fit:contain;}
  .case-img .ph{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}

  .case-name{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:10px;display:block;font-family:'IBM Plex Mono',monospace;}

  .case-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .qty-row{display:flex;align-items:baseline;gap:6px;}
  .qty-val{font-size:19px;color:var(--gold-soft);font-weight:600;}
  .qty-label{font-size:10px;color:var(--muted);}
  .status-tag{font-size:9.5px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;}
  .status-tag.on{color:var(--gold-soft);}

  .case-detail-btn{
    margin-top:10px;width:100%;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.03em;
    padding:7px 8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;
  }
  .case-detail-btn:hover{color:var(--gold-soft);border-color:var(--gold-dim);}

  /* ── Collections ──────────────────────────────────────── */
  .collection-block{margin-bottom:32px;}
  .collection-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
    border-bottom:2px solid var(--line);padding-bottom:9px;margin-bottom:15px;}
  .collection-title{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:700;margin:0;color:var(--parchment);}
  .completion-tag{font-size:11px;color:var(--muted);white-space:nowrap;}
  .completion-tag b{color:var(--gold-soft);font-weight:600;}

  .rarity-group{margin-bottom:18px;}
  .rarity-group-label{display:flex;align-items:center;gap:8px;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.07em;margin:0 0 9px;color:var(--muted);}
  .rarity-group-label .rdot{width:6px;height:6px;border-radius:50%;}
  .rarity-group-label .rcount{color:var(--muted);font-weight:400;}

  .skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:1px;background:var(--line);}
  .skin-card{background:var(--panel);padding:12px 14px;border-left:3px solid var(--consumer);}
  .skin-card:hover{background:var(--panel-2);}

  .skin-img{width:100%;height:96px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;}
  .skin-img img{width:100%;height:100%;object-fit:contain;}
  .skin-img .ph{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .skin-grade{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;display:block;}
  .skin-weapon{font-size:12px;color:var(--muted);}
  .skin-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--parchment);}

  .g-classified{border-left-color:var(--classified);} .g-classified .skin-grade{color:var(--classified);}
  .g-restricted{border-left-color:var(--restricted);} .g-restricted .skin-grade{color:var(--restricted);}
  .g-milspec{border-left-color:var(--milspec);} .g-milspec .skin-grade{color:var(--milspec);}
  .g-industrial{border-left-color:var(--industrial);} .g-industrial .skin-grade{color:var(--industrial);}
  .g-consumer{border-left-color:var(--consumer);} .g-consumer .skin-grade{color:var(--consumer);}
  .g-covert{border-left-color:var(--covert);} .g-covert .skin-grade{color:var(--covert);}
  .g-gold{border-left-color:var(--goldrare);} .g-gold .skin-grade{color:var(--goldrare);}
  .g-gold{background:linear-gradient(180deg, rgba(229,184,75,.07), transparent);}

  /* ── Szczegóły skrzynki ───────────────────────────────── */
  .cd-head{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin:20px 0 18px;}
  .cd-img{width:132px;height:100px;background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .cd-img img{width:100%;height:100%;object-fit:contain;}
  .cd-img .ph{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .cd-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin:0 0 4px;color:var(--parchment);}
  .cd-sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 12px;}
  .cd-facts{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);background:var(--panel);width:fit-content;}
  .cd-fact{padding:9px 16px;border-right:1px solid var(--line);}
  .cd-fact:last-child{border-right:none;}
  .cd-fact span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px;}
  .cd-fact b{font-size:13px;font-weight:500;color:var(--parchment);}
  .cd-fact b.on{color:var(--gold-soft);}
  .cd-note{font-size:12px;color:var(--muted);line-height:1.7;white-space:pre-line;margin:14px 0 0;max-width:620px;}
  .cd-section-label{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;margin:26px 0 12px;
    color:var(--gold-soft);border-bottom:1px solid var(--line);padding-bottom:7px;}

  .cd-rarity-group{margin-bottom:10px;}
  .cd-rarity-group .rarity-group-label{margin-bottom:6px;}
  .cd-skin-grid{display:inline-flex;flex-wrap:wrap;gap:1px;background:var(--line);}
  .cd-skin-card{width:126px;flex:0 0 126px;background:var(--panel);padding:7px 8px;border-left:3px solid var(--consumer);}
  .cd-skin-card:hover{background:var(--panel-2);}
  .cd-skin-img{width:100%;height:46px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:5px;}
  .cd-skin-img img{width:100%;height:100%;object-fit:contain;}
  .cd-skin-img .ph{font-size:7.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .cd-skin-grade{font-size:8px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;display:block;}
  .cd-skin-weapon{font-size:9.5px;color:var(--muted);}
  .cd-skin-name{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:600;color:var(--parchment);line-height:1.15;}
  .cd-skin-card.clickable{cursor:pointer;}
  .cd-skin-card.clickable.open{outline:1px solid var(--gold);}
  .cd-skin-more{font-size:7.5px;color:var(--gold-soft);letter-spacing:.05em;text-transform:uppercase;margin-top:4px;display:block;}
  .cd-shared{border:1px solid var(--gold);background:var(--panel);padding:10px 12px;margin:0 0 12px;}
  .cd-shared h4{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--gold);margin:0 0 8px;font-weight:600;}
  .cd-shared-list{display:flex;flex-wrap:wrap;gap:6px;}
  .cd-shared-item{font-size:10px;letter-spacing:.03em;padding:4px 8px;border:1px solid var(--line);
    background:var(--bg);color:var(--parchment);cursor:pointer;}
  .cd-shared-item:hover{border-color:var(--gold);color:var(--gold);}
  .cd-shared-item.self{opacity:.5;cursor:default;}
  .cd-wear-row{display:flex;gap:2px;margin-top:5px;flex-wrap:wrap;}
  .cd-wear-chip{font-size:7.5px;letter-spacing:.02em;padding:1px 3px;border:1px solid var(--line);
    background:var(--bg);color:var(--muted);}
  .cd-wear-chip.active{background:var(--gold);border-color:var(--gold);color:#13141a;font-weight:600;}

  .wear-row{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;}
  .wear-chip{font-size:9.5px;letter-spacing:.03em;padding:3px 6px;border:1px solid var(--line);
    background:var(--bg);color:var(--muted);}
  .wear-chip.active{background:var(--gold);border-color:var(--gold);color:#13141a;font-weight:600;}

  .empty{text-align:center;padding:44px;color:var(--muted);border:1px dashed var(--line);font-size:12.5px;}
  .hidden{display:none !important;}

  /* ── Profil (easter egg) ──────────────────────────────── */
  .profile-top-row{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;margin-bottom:28px;}
  .profile-head{display:flex;gap:22px;align-items:flex-start;flex:1 1 320px;margin-bottom:0;}
  .profile-side{flex:0 1 220px;min-width:180px;padding-top:2px;}
  .profile-side-text{font-size:12px;color:var(--muted);line-height:1.7;white-space:pre-line;}
  @media (max-width:700px){ .profile-top-row{flex-direction:column;} }
  .profile-avatar-box{width:96px;height:96px;background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .profile-avatar-box img{width:100%;height:100%;object-fit:cover;}
  .profile-avatar-box .ph{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .profile-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:2px 0 6px;}
  .profile-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin:0 0 8px;color:var(--parchment);}
  .profile-status{font-size:12px;color:var(--muted);max-width:540px;line-height:1.7;white-space:pre-line;}

  .profile-contact{border:1px solid var(--line);background:var(--panel);margin-bottom:6px;}
  .profile-contact-row{font-size:12.5px;color:var(--parchment);margin:0;padding:11px 18px;
    display:flex;align-items:baseline;gap:16px;}
  .profile-contact-row + .profile-contact-row{border-top:1px solid var(--line);}
  .profile-contact-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--gold-soft);width:64px;flex-shrink:0;}

  .profile-photo-row{display:flex;gap:12px;flex-wrap:wrap;}
  .profile-photo-box{flex:1;min-width:180px;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--line);
    overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .profile-photo-box img{width:100%;height:100%;display:block;object-fit:cover;}
  .profile-photo-box.ph-only{padding:20px;text-align:center;}
  .profile-photo-box .ph{font-size:10.5px;color:var(--muted);letter-spacing:.03em;line-height:1.6;}

  .secret2-layout{display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
  .secret2-text{flex:1 1 260px;min-width:220px;}
  .secret2-photo{flex:1 1 260px;min-width:220px;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--line);
    overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .secret2-photo img{width:100%;height:100%;display:block;object-fit:cover;}
  .secret2-photo.ph-only{padding:20px;text-align:center;}
  @media (max-width:700px){ .secret2-layout{flex-direction:column;} }

  /* ── Poprawki UI (v10) ────────────────────────────────── */
  html{scroll-behavior:smooth;}
  ::selection{background:var(--gold-dim);color:var(--parchment);}
  *:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .case-card,.skin-card,.cd-skin-card{transition:background .18s ease,transform .18s ease,box-shadow .18s ease,opacity .18s ease;}
  .case-card:hover,.skin-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .case-card:not(.owned):hover{opacity:.75;}
  .tab-btn,.filter-btn,.case-detail-btn{transition:color .18s ease,background .18s ease,border-color .18s ease;}
  .case-img img,.skin-img img{transition:transform .25s ease;}
  .case-card:hover .case-img img,.skin-card:hover .skin-img img{transform:scale(1.04);}

  .search-wrap{position:relative;margin-bottom:8px;}
  .search-wrap .search{margin-bottom:0;padding-right:82px;}
  .search-clear{position:absolute;top:50%;right:8px;transform:translateY(-50%);
    background:transparent;border:1px solid var(--line);color:var(--muted);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 9px;}
  .search-clear:hover{color:var(--gold-soft);border-color:var(--gold-dim);}
  .search-hint{position:absolute;top:50%;right:8px;transform:translateY(-50%);
    font-size:10px;color:var(--muted);letter-spacing:.06em;pointer-events:none;opacity:.75;}
  .result-count{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    min-height:15px;margin:0 0 16px;}
  .result-count b{color:var(--gold-soft);font-weight:600;}
  .empty .empty-actions{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  @media (max-width:600px){
    body{padding:14px 8px;}
    .app{padding:20px 12px 32px;}
    .header{align-items:flex-start;gap:12px;}
    .stats{width:100%;}
    .stat{padding:0 12px;}
    .tabs{gap:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tab-btn{white-space:nowrap;}
    .filter-bar{width:100%;}
    .filter-btn{flex:1 1 auto;}
    .search-hint{display:none;}
    .case-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
    .skin-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
    .case-card:hover,.skin-card:hover{transform:none;}
  }

  /* ── Skiny na serwerze ────────────────────────────────── */
  .srv-intro{border:1px solid var(--line);background:var(--panel);padding:16px 18px;margin:0 0 18px;}
  .srv-intro h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin:0 0 8px;color:var(--parchment);}
  .srv-intro p{margin:0 0 6px;font-size:12px;line-height:1.65;color:var(--muted);}
  .srv-intro p b{color:var(--gold-soft);font-weight:500;}
  .srv-intro code{color:var(--gold);font-size:11.5px;}
  .srv-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px;}
  .srv-search{flex:1 1 240px;background:var(--panel-2);border:1px solid var(--line);color:var(--parchment);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:10px 12px;border-radius:2px;outline:none;}
  .srv-search:focus{border-color:var(--gold-dim);}
  .srv-count{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
  .srv-count b{color:var(--gold-soft);}
  .srv-chosen{border:1px solid var(--gold-dim);background:var(--panel);padding:14px 16px;margin:0 0 22px;}
  .srv-chosen-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .srv-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);
    padding:6px 9px;font-size:11px;color:var(--parchment);}
  .srv-chip img{width:44px;height:26px;object-fit:contain;}
  .srv-chip .srv-chip-w{color:var(--gold-soft);}
  .srv-chip button{background:none;border:none;color:var(--covert);cursor:pointer;font-size:13px;line-height:1;padding:0 2px;}
  .srv-skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .srv-card{border:1px solid var(--line);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:6px;
    cursor:pointer;transition:border-color .15s,transform .15s;}
  .srv-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);}
  .srv-card.selected{border-color:var(--gold);background:var(--panel-2);}
  .srv-card .srv-img{background:var(--panel-2);border:1px solid var(--line);height:92px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .srv-card .srv-img img{max-width:100%;max-height:100%;object-fit:contain;}
  .srv-card .srv-img .ph{font-size:10px;color:var(--muted);}
  .srv-grade{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .srv-weapon{font-size:11.5px;color:var(--gold-soft);}
  .srv-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:var(--parchment);line-height:1.2;}
  .srv-col{font-size:10px;color:var(--muted);}
  .srv-pick{margin-top:auto;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dim);}
  .srv-card.selected .srv-pick{color:var(--gold);}

  /* ── Skiny na serwerze: strony, StatTrak, zapis ───────── */
  .srv-side-bar{display:flex;gap:8px;margin:0 0 14px;}
  .srv-side-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;}
  .srv-side-btn:hover{border-color:var(--gold-dim);color:var(--parchment);}
  .srv-side-btn.active{border-color:var(--gold);color:var(--gold);background:var(--panel-2);}
  .srv-side-btn small{display:block;font-size:9.5px;letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:2px;}
  .srv-savebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:1px solid var(--line);
    background:var(--panel-2);padding:12px 14px;margin:0 0 18px;}
  .srv-save-btn{border:1px solid var(--gold);background:var(--gold-dim);color:#12100c;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px;}
  .srv-save-btn:hover{background:var(--gold);}
  .srv-save-btn[disabled]{opacity:.4;cursor:not-allowed;background:var(--panel);color:var(--muted);border-color:var(--line);}
  .srv-save-note{font-size:11px;color:var(--muted);}
  .srv-save-note.dirty{color:var(--gold-soft);}
  .srv-save-note.err{color:var(--covert);}
  .srv-save-note.ok{color:var(--milspec, #7fb069);}
  .srv-limits{font-size:10.5px;color:var(--muted);letter-spacing:.04em;}
  .srv-st{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:2px;}
  .srv-st input{accent-color:var(--gold);cursor:pointer;}
  .srv-st.on{color:#e08b3a;}
  .srv-chip .srv-st-tag{color:#e08b3a;font-size:9.5px;letter-spacing:.06em;}
  .srv-kindtag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dim);}
  #srvStatus{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:var(--panel);padding:8px 12px;font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  #srvStatus .dot{width:8px;height:8px;border-radius:50%;background:var(--covert);box-shadow:0 0 8px currentColor;}
  #srvStatus.online{border-color:var(--gold-dim);color:var(--gold-soft);}
  #srvStatus.online .dot{background:#7fb069;}
  #srvStatus.checking .dot{background:var(--gold-dim);}
</style>

// zwraca nazwę pliku dla danego złotego itemu (najdłuższe pasujące dopasowanie)
function normName(s){ return String(s||"").replace(/\|/g," ").replace(/\s+/g," ").trim().toLowerCase(); }
function rareImgFor(weapon, caseName){
  const w = normName(weapon);
  const pick = (map) => {
    if(!map) return "";
    if(map[weapon]) return map[weapon];
    let best = "", bestKey = "";
    Object.keys(map).forEach(k => {
      const nk = normName(k);
      if((w === nk || w.startsWith(nk + " ")) && nk.length > best.length){ best = nk; bestKey = k; }
    });
    return bestKey ? map[bestKey] : "";
  };
  return pick(RARE_IMAGES_BY_CASE[caseName]) || pick(RARE_IMAGES);
}

// Słownik "★ Broń Skin" (bez "|") -> {weapon:"★ Broń", skin:"Skin"}, budowany z poprawnie
// sformatowanych kluczy RARE_IMAGES ("★ Broń | Skin"). Używany do naprawy list w CASE_GOLD,
// które mają nazwę broni i skina sklejone w jeden string bez separatora "|".
const GOLD_NAME_INDEX = {};
Object.keys(RARE_IMAGES).forEach(full => {
  const m = full.match(/^(★\s*[^|]+?)\s*\|\s*(.+)$/);
  if(!m) return;
  const weapon = m[1].trim();
  const skin = m[2].trim();
  const flat = (weapon + ' ' + skin).replace(/\s+/g,' ').trim();
  GOLD_NAME_INDEX[flat] = {weapon, skin};
});
// Kanoniczne nazwy złotych broni (muszą 1:1 pasować do DEFINDEX w server.js!).
// RARE_IMAGES ma format "Broń | Skin" TYLKO dla zwykłych wykończeń (Fade, Blue Steel itd.) —
// warianty fazowe/gemowe (Doppler, Doppler Ruby/Sapphire/Black Pearl, Doppler Phase 1-4,
// Gamma Doppler, Tiger Tooth, Damascus Steel, Marble Fade, Ultraviolet) i WSZYSTKIE rękawice
// są tam zapisane płasko bez "|", więc GOLD_NAME_INDEX ich nie zna. Dla takich przypadków
// dopasowujemy najdłuższy pasujący prefiks z tej listy zamiast poddawać się i brać cały
// string jako nazwę broni (co psuło zapis na serwerze - "nieznana broń").
const GOLD_WEAPON_NAMES = [
  "★ Bayonet", "★ Classic Knife", "★ Flip Knife", "★ Gut Knife", "★ Karambit",
  "★ M9 Bayonet", "★ Huntsman Knife", "★ Falchion Knife", "★ Bowie Knife",
  "★ Butterfly Knife", "★ Shadow Daggers", "★ Paracord Knife", "★ Survival Knife",
  "★ Ursus Knife", "★ Navaja Knife", "★ Nomad Knife", "★ Stiletto Knife",
  "★ Talon Knife", "★ Skeleton Knife", "★ Kukri Knife",
  "★ Bloodhound Gloves", "★ Sport Gloves", "★ Driver Gloves", "★ Hand Wraps",
  "★ Moto Gloves", "★ Specialist Gloves", "★ Hydra Gloves", "★ Broken Fang Gloves",
].sort((a, b) => b.length - a.length); // dłuższe najpierw, żeby "★ M9 Bayonet" nie ucięło się do "★ Bayonet"
function splitGoldName(raw){
  const flat = String(raw).replace(/\s+/g,' ').trim();
  // już poprawnie rozdzielone (zawiera "|") — zostaw bez zmian
  const m = flat.match(/^(★\s*[^|]+?)\s*\|\s*(.+)$/);
  if(m) return {weapon: m[1].trim(), skin: m[2].trim()};
  if(GOLD_NAME_INDEX[flat]) return GOLD_NAME_INDEX[flat];
  for(const w of GOLD_WEAPON_NAMES){
    if(flat === w) return {weapon: w, skin: ""};
    if(flat.startsWith(w + ' ')) return {weapon: w, skin: flat.slice(w.length).trim()};
  }
  console.warn('splitGoldName: nie rozpoznano nazwy broni w "' + flat + '"');
  return {weapon: flat, skin: ""};
}
// flatten "weapon skin" (bez "|") do porównań z listami CASE_GOLD
const flatWS = (weapon, skin) => (String(weapon||'').replace(/\s+/g,' ').trim() + ' ' + String(skin||'').replace(/\s+/g,' ').trim()).trim();

Object.keys(CASE_DETAILS).forEach(n => {
  const d = CASE_DETAILS[n];
  const pool = CASE_GOLD[n];
  const allowed = Array.isArray(pool) ? pool : [];
  d.items = (d.items || []).filter(it => {
    const gold = it.gold || it.grade === "Rare Special Item";
    if(gold) return allowed.includes(it.weapon) || allowed.includes(flatWS(it.weapon, it.skin));
    return it.grade !== "Industrial Grade" && it.grade !== "Consumer Grade";
  });
});

// wstrzykujemy złote itemy do CASE_DETAILS (jeśli nie zostały wpisane ręcznie)
Object.keys(CASE_GOLD).forEach(name => {
  const pool = CASE_GOLD[name];
  const list = Array.isArray(pool) ? pool : (GOLD_POOLS[pool] || []);
  const d = CASE_DETAILS[name] || (CASE_DETAILS[name] = {added:"",removed:"",note:"",items:[]});
  d.items = d.items || [];
  list.forEach(raw => {
    const {weapon, skin} = splitGoldName(raw);
    if(!d.items.some(it => it.weapon === weapon && it.skin === skin && (it.gold || it.grade === "Rare Special Item"))){
      d.items.push({gold:true, grade:"Rare Special Item", weapon, skin, img:rareImgFor(flatWS(weapon, skin), name)});
    }
  });
});

// uzupełniamy brakujące obrazki złotych itemów z RARE_IMAGES / RARE_IMAGES_BY_CASE
Object.keys(CASE_DETAILS).forEach(name => {
  (CASE_DETAILS[name].items || []).forEach(it => {
    const gold = it.gold || it.grade === "Rare Special Item";
    if(gold && !it.img) it.img = rareImgFor(flatWS(it.weapon, it.skin), name);
  });
});

// indeks: nazwa złotego itemu -> skrzynki, w których występuje
const GOLD_INDEX = {};
Object.keys(CASE_DETAILS).forEach(cn => {
  (CASE_DETAILS[cn].items || []).forEach(it => {
    if(it.gold || it.grade === "Rare Special Item"){
      (GOLD_INDEX[it.weapon] = GOLD_INDEX[it.weapon] || []).push(cn);
    }
  });
});

function normQ(s){

const SKIN_API_BASE = 'https://etc-maui-beach-fever.trycloudflare.com'; // TUTAJ
// Publiczny odczyt loadoutów prosto z repo (działa dla publicznego repo; bez Workera i bez hasła).
// odczyt loadoutu idzie teraz przez to samo API co zapis
const STEAM_ID_KEY = 'cs2ServerSteamId';
const SERVER_STORAGE_KEY = 'cs2ServerLoadout_v2';
const SIDES = ['CT','T'];
const SIDE_LABEL = {CT:'Counter-Terrorists', T:'Terrorists'};
let serverQuery = '';

const GRADE_RANK = {"Rare Special Item":0,"Covert":1,"Classified":2,"Restricted":3,"Mil-Spec Grade":4,"Industrial Grade":5,"Consumer Grade":6};

// struktura: { CT: { "★ Karambit": {skin:"Fade", st:false} }, T: {...} }
function emptyLoadout(){ return {CT:{}, T:{}}; }
let savedPicks = emptyLoadout();
try {
  const raw = JSON.parse(localStorage.getItem(SERVER_STORAGE_KEY) || 'null');
  if(raw && raw.CT && raw.T) savedPicks = raw;
} catch(e){ savedPicks = emptyLoadout(); }
let draftPicks = JSON.parse(JSON.stringify(savedPicks));

function srvIsDirty(){ return JSON.stringify(draftPicks) !== JSON.stringify(savedPicks); }
function srvItemKind(s){
  const w = String(s.weapon||'');
  if(/glove|hand wraps/i.test(w)) return 'glove';
  if(isGoldSkin(s)) return 'knife';
  return 'weapon';
}
function srvCanStatTrak(s){ return srvItemKind(s) !== 'glove'; }

function allServerSkins(){
  const out = [];
  COLLECTIONS.forEach(col => (col.skins||[]).forEach(s => out.push({...s, collection: col.name})));
  const seenGold = new Set();
  Object.keys(CASE_DETAILS).forEach(cn => (CASE_DETAILS[cn].items||[]).forEach(it => {
    if((it.gold || it.grade === "Rare Special Item") && !seenGold.has(it.weapon + '|' + (it.skin||''))){
      seenGold.add(it.weapon + '|' + (it.skin||''));
      out.push({grade:"Rare Special Item", weapon:it.weapon, skin:it.skin||"",
                img:it.img || rareImgFor(it.weapon, cn), collection:"Złote itemy", gold:true});
    }
  }));
  return out.sort((a,b)=> a.weapon.localeCompare(b.weapon,'pl') || a.skin.localeCompare(b.skin,'pl'));
}
let _srvAll = null;
function serverSkinsCached(){ if(!_srvAll) _srvAll = allServerSkins(); return _srvAll; }
function sortServerSkins(list){
  const out = list.slice();
  if(srvSort === 'alpha'){
    out.sort((a,b)=> (a.weapon+' '+(a.skin||'')).localeCompare(b.weapon+' '+(b.skin||''),'pl'));
  } else if(srvSort === 'rarity'){
    out.sort((a,b)=> (GRADE_RANK[a.grade]??9)-(GRADE_RANK[b.grade]??9)
              || a.weapon.localeCompare(b.weapon,'pl') || (a.skin||'').localeCompare(b.skin||'','pl'));
  }
  if(srvDir === -1) out.reverse();
  return out;
}
function setSrvSort(mode){ srvSort = (srvSort === mode) ? 'default' : mode; renderServer(); }
function isGoldSkin(s){ return !!(s.gold || s.grade === "Rare Special Item"); }
function setSrvKind(kind){ srvKind = (srvKind === kind) ? 'all' : kind; renderServer(); }
function setSrvDir(){ srvDir = -srvDir; renderServer(); }
function setSrvSide(side){ srvSide = side; renderServer(); }
function serverSkinImg(weapon, skin){
  const hit = serverSkinsCached().find(s => s.weapon === weapon && s.skin === skin);
  return hit ? hit.img : '';
}
function srvFindSkin(weapon, skin){
  return serverSkinsCached().find(s => s.weapon === weapon && s.skin === skin) || {weapon, skin};
}
function srvSideCount(side, kind){
  const side_ = draftPicks[side] || {};
  return Object.keys(side_).filter(w => srvItemKind(srvFindSkin(w, side_[w].skin)) === kind).length;
}

let srvVisible = [];
function srvToggle(idx){
  const s = srvVisible[idx];
  if(!s) return;
  const side = draftPicks[srvSide];
  const cur = side[s.weapon];
  if(cur && cur.skin === s.skin){ delete side[s.weapon]; renderServer(); return; }
  const kind = srvItemKind(s);
  if(kind === 'knife' || kind === 'glove'){
    // maks 1 nóż i 1 para rękawic na stronę — nowy wybór zastępuje poprzedni
    Object.keys(side).forEach(w => {
      if(srvItemKind(srvFindSkin(w, side[w].skin)) === kind) delete side[w];
    });
  }
  side[s.weapon] = {skin: s.skin, st: false};
  renderServer();
}
function srvToggleST(idx){
  const s = srvVisible[idx];
  if(!s || !srvCanStatTrak(s)) return;
  const p = draftPicks[srvSide][s.weapon];
  if(!p || p.skin !== s.skin) return;
  p.st = !p.st;
  renderServer();
}
let srvChips = [];
function srvRemoveChip(i){
  const c = srvChips[i];
  if(!c) return;
  delete draftPicks[c.side][c.weapon];
  renderServer();
}
function clearServerPicks(){ draftPicks[srvSide] = {}; renderServer(); }
function srvRevert(){ draftPicks = JSON.parse(JSON.stringify(savedPicks)); srvSaveMsg=''; renderServer(); }

async function srvSave(){
  if(!srvOnline){ srvSaveMsg = 'Serwer zapisu offline — spróbuj ponownie za chwilę.'; srvSaveMsgClass='err'; renderServer(); return; }
  const steamId = srvSteamId.trim();
  if(!steamId){ srvSaveMsg = 'Wpisz swoje Steam ID przed zapisem.'; srvSaveMsgClass='err'; renderServer(); return; }
  const pwInput = document.getElementById('srvPassword');
  const password = pwInput ? pwInput.value : '';   // hasło żyje tylko w pamięci, na czas tej wysyłki
  if(pwInput) pwInput.value = '';
  if(!password){ srvSaveMsg = 'Wpisz hasło zapisu.'; srvSaveMsgClass='err'; renderServer(); return; }
  srvSaveMsg = 'Zapisuję…'; srvSaveMsgClass=''; renderServer();
  try {
    const r = await fetch(SKIN_API_BASE + '/save', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({steamId, loadout: draftPicks, password})
    });
    if(r.status === 403){ srvSaveMsg = 'Nieprawidłowe hasło — zapis odrzucony.'; srvSaveMsgClass='err'; renderServer(); return; }
    const data = await r.json().catch(() => ({}));
    if(!r.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + r.status));
    savedPicks = JSON.parse(JSON.stringify(draftPicks));
    try { localStorage.setItem(SERVER_STORAGE_KEY, JSON.stringify(savedPicks)); } catch(e){}
    srvSaveMsg = 'Zapisane ✓ — trafi na serwer w ciągu kilku sekund'; srvSaveMsgClass='ok';
  } catch(e){
    srvSaveMsg = 'Zapis nieudany: ' + e.message; srvSaveMsgClass='err';
  }
  renderServer();
}

// Publiczny odczyt: każdy, kto zna czyjeś Steam ID, może podejrzeć zapisany loadout.
async function srvLoad(){
  const steamId = srvSteamId.trim();
  if(!steamId){ srvSaveMsg = 'Wpisz Steam ID, żeby wczytać loadout.'; srvSaveMsgClass='err'; renderServer(); return; }
  srvSaveMsg = 'Wczytuję…'; srvSaveMsgClass=''; renderServer();
  try {
    const r = await fetch(SKIN_API_BASE + '/load?steamId=' + encodeURIComponent(steamId), {cache:'no-store'});
    if(r.status === 404){ srvSaveMsg = 'Brak zapisanego loadoutu dla tego Steam ID.'; srvSaveMsgClass='err'; renderServer(); return; }
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const lo = data.loadout || data;
    if(!lo || typeof lo !== 'object' || !lo.CT || !lo.T) throw new Error('zły format pliku');
    savedPicks = {CT: lo.CT || {}, T: lo.T || {}};
    draftPicks = JSON.parse(JSON.stringify(savedPicks));
    try { localStorage.setItem(SERVER_STORAGE_KEY, JSON.stringify(savedPicks)); } catch(e){}
    srvSaveMsg = 'Wczytane ✓ (' + steamId + ')'; srvSaveMsgClass='ok';
  } catch(e){
    srvSaveMsg = 'Wczytanie nieudane: ' + e.message; srvSaveMsgClass='err';
  }
  renderServer();
}

function renderCaseDetail(){

  if(!c){ el.innerHTML = `<div class="empty">Nie wybrano skrzynki.</div>`; return; }

  const groups = DROP_RARITY_ORDER
    .map(g => ({ grade:g, list: shown.filter(it => (isGold(it) ? "Rare Special Item" : it.grade) === g) }))

  const rarityChips = DROP_RARITY_ORDER.filter(g => g !== "Rare Special Item").map(g => `

  el.innerHTML = `
    <button class="empty-link" style="margin-top:0" onclick="switchToView('cases')">← Wróć do listy</button>

          <div class="cd-fact"><span>Zdobycie</span><b class="on">${esc(d.acq || acqOf(c.name))}</b></div>
          <div class="cd-fact"><span>Dostępność</span><b class="${d.removed ? '' : 'on'}">${d.removed ? 'Nie można zdobyć' : 'Można zdobyć'}</b></div>
        </div>
        ${d.note ? `<p class="cd-note">${esc(d.note)}</p>` : ''}
      </div>
    </div>

    <h3 class="cd-section-label">Możliwe dropy</h3>

    <div class="filter-bar">
      <button class="filter-btn ${caseDropTypes.has('gold')?'active':''}" onclick="toggleCaseDropType('gold')">Złote (${golds.length})</button>
      <button class="filter-btn ${caseDropTypes.has('normal')?'active':''}" onclick="toggleCaseDropType('normal')">Zwykłe (${normals.length})</button>
    </div>

    ${caseDropTypes.has('normal') ? `<div class="filter-bar" style="margin-bottom:20px">${rarityChips}</div>` : ''}

    ${groups.length === 0
      ? (wildfireButtonAvailable(c.name)
          ? `<div class="empty"><button class="empty-link" style="margin-top:0" onclick="wildfireReveal()">?</button></div>`
          : (feverHintFor(c.name)
              ? `<div class="empty"><span class="fever-hint">${esc(feverHintFor(c.name))}</span></div>`
              : (feverStage === 3
                  ? (silenceFinalActive
                      ? `<div class="empty"><span class="glitch-text glitch-text-2" data-text="Radio silence">Radio silence</span></div>`
                      : keyHotspotStage === 3
                      ? `<div class="empty"><span class="glitch-text glitch-text-2" data-text="pora na bronie mój drogi!">pora na bronie mój drogi!</span></div>`
                      : `<div class="empty"><span class="glitch-text" data-text="otwórz aby przejść dalej">otwórz aby przejść dalej</span></div>`)
                  : `<div class="empty">${esc(MYSTERY_TEXTS[mysteryStage])}</div>`)))
      : groups.map(g => `
        <div class="rarity-group cd-rarity-group">
          <p class="rarity-group-label">
            <span class="rdot" style="background:${g.grade === 'Rare Special Item' ? 'var(--goldrare)' : (g.grade === 'Covert' ? 'var(--covert)' : 'var(' + RARITY_VAR[g.grade] + ')')}"></span>

          <div class="cd-skin-grid">
            ${g.list.map(it => `
              <div class="cd-skin-card ${dropGradeClass(it)} ${isGold(it) ? 'clickable' : ''} ${openGoldItem===it.weapon?'open':''} ${isFeverTarget(it, c.name) ? 'fever-target' : ''}"
                   ${isGold(it) ? `onclick="goldCardClick('${esc(it.weapon).replace(/'/g,"\\'")}')"` : ''}>
                ${imgBox('cd-skin-img', it.img, it.weapon + ' ' + it.skin)}
                <span class="cd-skin-grade">${esc(isGold(it) ? (it.grade || 'Rare Special Item') : it.grade)}</span>
                <div class="cd-skin-weapon">${esc(it.weapon)}</div>
                <div class="cd-skin-name">${esc(it.skin)}</div>
                ${(it.wears && it.wears.length) ? `<div class="cd-wear-row">${WEARS.map(w => `<span class="cd-wear-chip ${it.wears.includes(w)?'active':''}">${w}</span>`).join('')}</div>` : ''}

function renderStats(){
  const bar = document.getElementById('statsBar');
  const q = getQuery();

  if(currentView === 'cases'){
    // Tylko to, co aktualnie widać: zgodnie z zaznaczonymi filtrami kategorii i wyszukiwaniem.
    const visible = CASES.filter(c => activeCats.has(c.cat) && normQ(c.name).includes(q));
    const ownedTypes = visible.filter(c => c.owned).length;
    const totalQty = visible.reduce((s,c) => s + c.qty, 0);
    bar.innerHTML = `
      <div class="stat"><b>${ownedTypes}</b><span>posiadanych typów</span></div>
      <div class="stat"><b>${totalQty}</b><span>sztuk łącznie</span></div>
    `;
  } else if(currentView === 'collections'){
    // Liczba posiadanych skinów w rozbiciu na rodzaj (rzadkość), tylko z zaznaczonych kolekcji.
    let visibleCols = COLLECTIONS.filter(col => activeCollections.has(col.name));
  if(colSortAlpha) visibleCols = [...visibleCols].sort((a,b)=>a.name.localeCompare(b.name,'pl'));
  if(colSortDir === -1) visibleCols = [...visibleCols].reverse();
    bar.innerHTML = RARITY_ORDER.map(grade => {
      let count = 0;
      visibleCols.forEach(col => {
        col.skins.forEach(s => {
          if(s.grade !== grade) return;
          if((s.wears||[]).length === 0) return;
          const matches = !q || s.weapon.toLowerCase().includes(q) || s.skin.toLowerCase().includes(q) || col.name.toLowerCase().includes(q);
          if(matches) count++;
        });
      });
      return `
        <div class="stat stat-grade" style="border-left-color:var(${RARITY_VAR[grade]})">
          <b style="color:var(${RARITY_VAR[grade]})">${count}</b>
          <span>${esc(grade)}</span>
        </div>`;
    }).join('');
  } else {
    bar.innerHTML = '';
  }
}

function countResults(){
  const q = getQuery();
  if(currentView === 'cases'){
    const n = CASES.filter(c => activeCats.has(c.cat) && normQ(c.name).includes(q)).length;
    return { n, label: n === 1 ? 'pozycja' : (n >= 2 && n <= 4 ? 'pozycje' : 'pozycji') };
  }
  if(currentView === 'collections'){
    let n = 0;
    COLLECTIONS.filter(col => activeCollections.has(col.name)).forEach(col => {
      n += col.skins.filter(s => !q || normQ(s.weapon).includes(q) || normQ(s.skin).includes(q) || normQ(col.name).includes(q)).length;
    });
    return { n, label: n === 1 ? 'skin' : (n >= 2 && n <= 4 ? 'skiny' : 'skinów') };
  }
  return null;
}
function updateSearchUI(){
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  const hint = document.getElementById('searchHint');
  const out = document.getElementById('resultCount');
  const wrap = input.closest('.search-wrap');
  const hasQuery = input.value.trim() !== '';
  const searchable = currentView === 'cases' || currentView === 'collections';
  wrap.classList.toggle('hidden', !searchable);
  clearBtn.classList.toggle('hidden', !hasQuery);
  hint.classList.toggle('hidden', hasQuery);
  const res = searchable ? countResults() : null;
  out.innerHTML = res ? `<b>${res.n}</b> ${res.label}${hasQuery ? ' dla „' + esc(input.value.trim()) + '”' : ''}` : '';
}

   1) wejdź i wyjdź 8 razy ze skrzynki Operation Wildfire Case  -> tło wildfire_0.png

      -> zamiast tekstu pojawia się przycisk; po kliknięciu znika,
         wraca poprzedni tekst, a tło zmienia się na wildfire_2.png */
const WILDFIRE_CASE_NAME = "Operation Wildfire Case";
const WILDFIRE_BG_0 = "radio_0/wildfire_0.png";
const WILDFIRE_BG_1 = "radio_0/wildfire_1.png";
const WILDFIRE_BG_2 = "radio_0/wildfire_2.png";
const WILDFIRE_PHRASE = "the question i asked wildfire";
const WILDFIRE_VISITS_NEEDED = 8;

let wildfireStage = 0;      // 0: start, 1: po 8 wejściach, 2: po frazie, 3: po kliknięciu
let wildfireVisits = 0;
let wildfireBuffer = '';

function setPageBackground(src){
  BACKGROUND_IMAGE = src;
  document.body.style.backgroundImage = `url("${src}")`;
}

function noteWildfireExit(){
  if(!radioSilenceActive || wildfireStage !== 0) return;
  if(!currentCaseDetail || currentCaseDetail.name !== WILDFIRE_CASE_NAME) return;
  wildfireVisits++;
  if(wildfireVisits >= WILDFIRE_VISITS_NEEDED){
    wildfireStage = 1;
    setPageBackground(WILDFIRE_BG_0);
    PROFILE_EXTRA = PROFILE_EXTRA_STAGE2B;
    renderProfil();
  }
}

function wildfireButtonAvailable(caseName){
  return wildfireStage === 2 && caseName === WILDFIRE_CASE_NAME;
}

function wildfireReveal(){
  if(wildfireStage !== 2) return;
  wildfireStage = 3;
  setPageBackground(WILDFIRE_BG_2);
  renderCaseDetail();
}

document.addEventListener('keydown', (e) => {
  if(wildfireStage !== 1) return;
  if(currentView === 'caseDetail'){ wildfireBuffer = ''; return; }
  if(e.key === 'Enter'){
    const typed = wildfireBuffer.trim().toLowerCase();
    wildfireBuffer = '';
    if(typed === WILDFIRE_PHRASE){
      wildfireStage = 2;
      setPageBackground(WILDFIRE_BG_1);
    }
    return;
  }
  if(e.key === 'Backspace'){ wildfireBuffer = wildfireBuffer.slice(0, -1); return; }
  if(e.key.length !== 1) return;
  wildfireBuffer = (wildfireBuffer + e.key).slice(-60);
});

/* ── Łańcuch "Fever" (dostępny po ukończeniu Wildfire) ───────────────────
   1) wpisz "The question i asked fever" + Enter  -> tło fever_0.png
   2) w Fever Case (wyłączone wszystkie opcje) pojawia się nazwa losowego noża;
      znajdź ten nóż w dowolnej skrzynce (jest podświetlony) i kliknij  -> fever_1.png
   3) to samo jeszcze raz z nowym nożem                                  -> fever_2.png */
const FEVER_CASE_NAME = "Fever Case";
const FEVER_PHRASE = "the question i asked fever";
const FEVER_BG_0 = "radio_0/fever_0.png";
const FEVER_BG_1 = "radio_0/fever_1.png";
const FEVER_BG_2 = "radio_0/fever_2.png";

let feverStage = 0;        // 0: czeka na frazę, 1: polowanie #1, 2: polowanie #2, 3: koniec
let feverTarget = null;    // nazwa noża do znalezienia
let feverBuffer = '';

document.head.insertAdjacentHTML('beforeend', `<style>
  .fever-hint{ color:var(--gold-soft, #e8c37a); letter-spacing:.08em; text-transform:uppercase; font-weight:700 }
  .cd-skin-card.fever-target{
    cursor:pointer;
    outline:2px solid var(--goldrare, #e2b842);
    box-shadow:0 0 22px rgba(226,184,66,.55);
    animation:feverPulse 1.4s ease-in-out infinite;
  }
  @keyframes feverPulse{ 0%,100%{ box-shadow:0 0 12px rgba(226,184,66,.35) } 50%{ box-shadow:0 0 28px rgba(226,184,66,.8) } }
</style>`);

function feverPickTarget(){
  const pool = Object.keys(GOLD_INDEX).filter(w => (GOLD_INDEX[w] || []).some(cn => cn !== FEVER_CASE_NAME));
  if(!pool.length){ feverTarget = null; return; }
  feverTarget = pool[Math.floor(Math.random() * pool.length)];
}

function feverHintFor(caseName){
  if(caseName !== FEVER_CASE_NAME) return null;
  if(feverStage !== 1 && feverStage !== 2) return null;
  return feverTarget;
}

function isFeverTarget(it, caseName){
  if(feverStage !== 1 && feverStage !== 2) return false;
  if(!feverTarget || caseName === FEVER_CASE_NAME) return false;
  return isGold(it) && it.weapon === feverTarget;
}

function feverClickTarget(weapon){
  if(feverStage !== 1 && feverStage !== 2) return false;
  if(!feverTarget || weapon !== feverTarget) return false;
  if(!currentCaseDetail || currentCaseDetail.name === FEVER_CASE_NAME) return false;
  if(feverStage === 1){
    setPageBackground(FEVER_BG_1);
    feverStage = 2;
    feverPickTarget();
  } else {
    setPageBackground(FEVER_BG_2);
    feverStage = 3;
    feverTarget = null;
    PROFILE_EXTRA = PROFILE_EXTRA_STAGE4;
    renderProfil();
  }
  renderCaseDetail();
  return true;
}

function goldCardClick(weapon){
  if(feverClickTarget(weapon)) return;
  toggleGoldItem(weapon);
}

document.addEventListener('keydown', (e) => {
  if(wildfireStage !== 3 || feverStage !== 0) return;
  if(currentView === 'caseDetail'){ feverBuffer = ''; return; }
  if(e.key === 'Enter'){
    const typed = feverBuffer.trim().toLowerCase();
    feverBuffer = '';
    if(typed === FEVER_PHRASE){
      feverStage = 1;
      feverPickTarget();
      PROFILE_STATUS = PROFILE_STATUS_FEVER;
      PROFILE_EXTRA = PROFILE_EXTRA_STAGE3;
      renderProfil();
      setPageBackground(FEVER_BG_0);
      renderCaseDetail();
    }
    return;
  }
  if(e.key === 'Backspace'){ feverBuffer = feverBuffer.slice(0, -1); return; }
  if(e.key.length !== 1) return;
  feverBuffer = (feverBuffer + e.key).slice(-60);
});



/* ── Teksty profilu zmieniające się wraz z łańcuchem zagadek ──────────── */
const PROFILE_EXTRA_STAGE1 = "Ktoś tutaj szuka!";
const PROFILE_EXTRA_STAGE2 = "Żeby wyjść, trzeba wejść, trzeba pozbyć się skrzyń!";
const PROFILE_EXTRA_STAGE2B = "The question i asked";
const PROFILE_EXTRA_FINAL = "never got a reply";
const PROFILE_EXTRA_STAGE3 = "uważaj bo przegabisz! iloczyn tych liczb może cie poprowadzić dalej! żeby nie było ze będziesz musiał najpierw pytać przed odpowiedzią!";
const PROFILE_EXTRA_STAGE4 = "Radio silence.";
const PROFILE_STATUS_FEVER = "7 szklanki mąki pszennej\n1/2 szklanki wody\n1 szajk0\n4 łyżki oleju roślinnego\n2 gram piasku z wysp Palau";

/* ── Finał: po tle fever_2.png wpisz "The question i asked 28" ────────── */
const KEY_PHRASE = "the question i asked 28";
const KEY_BG = "radio_0/key_0.png";
const KEY_IMAGE = "radio_0/key0.png";
const KEY_BG_FEVER = "radio_0/key_fever1.png";
const KEY_BG_VAR = "radio_0/key_var1.png";
let keyStageActive = false;
let keyTaken = false;      // klucz kliknięty i zniknął
let keyHotspotStage = 0;   // 0: brak, 1: świeci prawy, 2: świeci lewy dolny, 3: koniec
let keyBuffer = '';

document.head.insertAdjacentHTML('beforeend', `<style>
  .profile-key-box{ margin-top:12px; border:1px solid var(--gold-dim); background:var(--panel); padding:6px; max-width:220px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease }
  .profile-key-box:hover{ transform:translateY(-2px); box-shadow:0 0 22px rgba(226,184,66,.55) }
  .profile-key-box img{ display:block; width:100%; height:auto }

  /* Efekt glitchu dla tekstu w skrzynkach */
  .glitch-text{ position:relative; display:inline-block; color:var(--gold-soft,#e8c37a); text-transform:uppercase; letter-spacing:.12em; font-weight:700; animation:glitchSkew 3.2s infinite linear alternate-reverse }
  .glitch-text::before, .glitch-text::after{ content:attr(data-text); position:absolute; left:0; top:0; width:100%; overflow:hidden; background:transparent }
  .glitch-text::before{ color:#57e5ff; clip-path:inset(0 0 55% 0); animation:glitchShift1 1.6s infinite linear alternate-reverse }
  .glitch-text::after{ color:#ff3b6b; clip-path:inset(50% 0 0 0); animation:glitchShift2 1.1s infinite linear alternate-reverse }
  @keyframes glitchShift1{ 0%{transform:translate(0,0)} 20%{transform:translate(-2px,-1px)} 40%{transform:translate(2px,1px)} 60%{transform:translate(-1px,1px)} 80%{transform:translate(1px,-1px)} 100%{transform:translate(0,0)} }
  @keyframes glitchShift2{ 0%{transform:translate(0,0)} 25%{transform:translate(2px,1px)} 50%{transform:translate(-2px,-1px)} 75%{transform:translate(1px,1px)} 100%{transform:translate(0,0)} }
  @keyframes glitchSkew{ 0%,88%,100%{ transform:skewX(0) } 90%{ transform:skewX(6deg) } 92%{ transform:skewX(-5deg) } 94%{ transform:skewX(2deg) } }

  /* Świecące punkty na tle (lekko mniej odblaskowe) */
  .key-hotspot{ position:fixed; width:56px; height:56px; border-radius:50%; z-index:60; cursor:pointer;
    background:radial-gradient(circle, rgba(255,240,190,.6) 0%, rgba(226,184,66,.28) 42%, rgba(226,184,66,0) 72%);
    animation:hotspotGlow 1.9s ease-in-out infinite; }
  .key-hotspot.right{ right:4%; top:46% }
  .key-hotspot.bottomleft{ left:5%; bottom:8% }
  @keyframes hotspotGlow{ 0%,100%{ transform:scale(.82); opacity:.4 } 50%{ transform:scale(1.05); opacity:.72 } }

  /* Inny wariant efektu glitchu (dla finałowego tekstu) */
  .glitch-text.glitch-text-2{ animation:glitchSkew 2.4s infinite linear alternate-reverse }
  .glitch-text.glitch-text-2::before{ color:#b6ff5a; animation:glitchShift1 1.1s infinite linear alternate-reverse }
  .glitch-text.glitch-text-2::after{ color:#ff8a3b; animation:glitchShift2 0.8s infinite linear alternate-reverse }
</style>`);

function renderKeyHotspots(){
  document.querySelectorAll('.key-hotspot').forEach(el => el.remove());
  if(keyHotspotStage === 1){
    const a = document.createElement('div');
    a.className = 'key-hotspot right';
    a.title = '';
    a.addEventListener('click', () => {
      setPageBackground(KEY_BG_FEVER);
      keyHotspotStage = 2;
      renderKeyHotspots();
    });
    document.body.appendChild(a);
  } else if(keyHotspotStage === 2){
    const b = document.createElement('div');
    b.className = 'key-hotspot bottomleft';
    b.addEventListener('click', () => {
      setPageBackground(KEY_BG_VAR);
      keyHotspotStage = 3;
      /* Dopiero teraz nadpisujemy easter egg nowymi wartościami */
      SECRET2_NAME = KEY_SECRET2_NAME;
      SECRET2_STATUS = KEY_SECRET2_STATUS;
      SECRET2_PHOTO = KEY_SECRET2_PHOTO;
      renderSecret2();
      renderKeyHotspots();
    });
    document.body.appendChild(b);
  }
}

function takeKey(){
  if(!keyStageActive || keyTaken) return;
  keyTaken = true;
  keyHotspotStage = 1;
  renderProfil();
  renderKeyHotspots();
}


document.addEventListener('keydown', (e) => {
  if(feverStage !== 3 || keyStageActive) return;
  if(currentView === 'caseDetail'){ keyBuffer = ''; return; }
  if(e.key === 'Enter'){
    const typed = keyBuffer.trim().toLowerCase();
    keyBuffer = '';
    if(typed === KEY_PHRASE){
      keyStageActive = true;
      setPageBackground(KEY_BG);
      renderProfil();
    }
    return;
  }
  if(e.key === 'Backspace'){ keyBuffer = keyBuffer.slice(0, -1); return; }
  if(e.key.length !== 1) return;
  keyBuffer = (keyBuffer + e.key).slice(-60);
});


/* ── Finał 2: wymaga keyHotspotStage 3 + odkrytej zakładki sekret 2 ───── */
const SILENCE_PHRASE = "the question i asked";
const SILENCE_BG = "radio_0/silence_1.png";
let silenceBuffer = '';
document.addEventListener('keydown', (e) => {
  if(silenceFinalActive) return;
  if(keyHotspotStage !== 3 || !discoveredTabs.secret2) return;
  if(currentView === 'caseDetail'){ silenceBuffer = ''; return; }
  if(e.key === 'Enter'){
    const typed = silenceBuffer.trim().toLowerCase();
    silenceBuffer = '';
    if(typed === SILENCE_PHRASE){
      silenceFinalActive = true;
      PROFILE_EXTRA = PROFILE_EXTRA_FINAL;
      setPageBackground(SILENCE_BG);
      renderProfil();
      renderCaseDetail();
    }
    return;
  }
  if(e.key === 'Backspace'){ silenceBuffer = silenceBuffer.slice(0, -1); return; }
  if(e.key.length !== 1) return;
  silenceBuffer = (silenceBuffer + e.key).slice(-60);
});

let mysteryStage = 0;
let mysteryBuffer = '';
document.addEventListener('keydown', (e) => {
  if(mysteryStage >= MYSTERY_TEXTS.length - 1) return;
  if(currentView === 'caseDetail') { mysteryBuffer = ''; return; }  // musisz wyjść z okna terminala

  if(e.key === 'Enter'){
    const typed = mysteryBuffer.trim().toLowerCase();
    const target = MYSTERY_TEXTS[mysteryStage].trim().toLowerCase();
    mysteryBuffer = '';
    if(typed === target){
      mysteryStage++;
      if(mysteryStage === 1){ PROFILE_EXTRA = PROFILE_EXTRA_STAGE1; renderProfil(); }
      if(MYSTERY_TEXTS[mysteryStage] === "Radio Silence"){ activateRadioSilence(); }
      renderCaseDetail();
    }
    return;
  }
  if(e.key === 'Backspace'){ mysteryBuffer = mysteryBuffer.slice(0, -1); return; }
  if(e.key.length !== 1) return;
  mysteryBuffer = (mysteryBuffer + e.key).slice(-60);
});

// Sekretne hasło wpisane gdziekolwiek na stronie (9,5 lub 9.5) otwiera drugą ukrytą zakładkę.
let secretBuffer = '';
document.addEventListener('keydown', (e) => {
  if(e.key.length !== 1) return; // pomijamy klawisze specjalne (Enter, Shift, itp.)
  const testBuffer = (secretBuffer + e.key).slice(-6);
  if(testBuffer.includes('9,5') || testBuffer.includes('9.5')){
    e.preventDefault(); // blokujemy wpisanie ostatniego znaku, żeby nic nie zostało w polu
    discoveredTabs.secret2 = true;
    switchToView('secret2');
    secretBuffer = '';
    return;
  }
  secretBuffer = testBuffer;
});

// Grafika własna, jeśli wpisana w BACKGROUND_IMAGE / AVATAR_IMAGE na górze pliku.
if(BACKGROUND_IMAGE){
  document.body.style.backgroundImage = `url("${BACKGROUND_IMAGE}")`;
}
if(AVATAR_IMAGE){
  const avatarEl = document.getElementById('avatarImg');
  avatarEl.src = AVATAR_IMAGE;
  avatarEl.classList.remove('hidden');
}

renderTabs();
renderCases();
renderCollectionFilterBar();
renderCollections();
renderProfil();
renderSecret2();
renderServer();
renderCaseDetail();
renderStats();
updateSearchUI();
</script>
